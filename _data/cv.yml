            Robotics Group</a> under <a href="https://me.berkeley.edu/people/koushil-sreenath/">Prof.
            Koushil Sreenath</a>.
          - Worked on computer vision in <a href="https://www-video.eecs.berkeley.edu/">Video
            and Image Processing Lab</a> under <a href="https://www2.eecs.berkeley.edu/Faculty/Homepages/zakhor.html">Prof.
            Avideh Zakhor</a>.
          - Conducted robotics research on locomotion, perception, and multi-robot collaboration,
            with deployments on Unitree A1 and MIT Mini Cheetah.
          - Built multi-robot system frameworks integrating LiDAR and depth sensing for
            collaborative load-moving tasks.
          - Developed simulation environments for testing robotic algorithms and control
            strategies.
          - Applied reinforcement learning (PPO) and Bayesian optimization for locomotion
            control, improving stability and adaptability.
        start_date: "2019"
        end_date: "2022"
      - position: Software Engineering Intern, <a href="https://www.samsara.com/">Samsara
